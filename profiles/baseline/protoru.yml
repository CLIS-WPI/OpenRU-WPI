# baseline ProtO-RU — emulator mode (no SDR / no USRP).
# Deleting the sdr: block selects original Ethernet loopback (test-IQ) mode;
# low-PHY on the OFH path still runs. See proto-ru example config comment.

log:
  filename: /tmp/proto-ru.log
  level: info

ru_emu:
  # Host CPUs inside PROTORU_CPUSET (lab.env; this host: 32-47 on NUMA1).
  timing_cpus: [32]
  cells:
    - network_interface: eth0
      ru_mac_addr: 02:00:00:00:00:20
      du_mac_addr: 02:00:00:00:00:10
      # No vlan_tag on docker bridge (AF_PACKET); both sides untagged.
      enable_promiscuous: true

      bandwidth: 20
      common_scs: 30
      dl_arfcn: 628032
      band: 78

      dl_port_id: [0, 1]
      ul_port_id: [0, 1]
      prach_port_id: [4, 5]
      prach_format: short

      compr_method_dl: bfp
      compr_bitwidth_dl: 9
      compr_method_ul: bfp
      compr_bitwidth_ul: 9
      compr_method_prach: bfp
      compr_bitwidth_prach: 9
      is_ul_static_compr_hdr: true
      is_dl_static_compr_hdr: true
      iq_scaling: 1.0

      t2a_max_cp_dl: 2435
      t2a_min_cp_dl: 2235
      t2a_max_cp_ul: 2435
      t2a_min_cp_ul: 2235
      t2a_max_up: 2215
      t2a_min_up: 2015
      ta3_max_up: 1200
      ta3_min_up: 800

      ofh_cpus: [33, 34]
      # no sdr: block → original emulator mode (answers C/U-plane with test IQ)
