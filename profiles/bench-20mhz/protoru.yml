# bench-20mhz ProtO-RU — UHD radio (N310-10), 20 MHz 2x2, stage 1 of the bench
# campaign (docs/BENCH_BUNDLE.md). Cabling: N310 RF0 -> RM520N ANT2 (primary n78
# TX/RX), RF1 -> ANT0 (second TX/RX); ANT1/ANT3 are RX-only on the UE side.
# CPU lanes are the bench map (Protó-RU 2-5).
#
# Sample rate 30.72 Msps = MCR 122.88 MHz / 4 (integer, even decimation), FFT
# 1024 = 30.72e6 / 30 kHz. The N310 only supports MCR 122.88 / 125.0 / 153.6 MHz
# (Ettus KB "N300/N310" and the N300/N310/N320/N321 Getting Started Guide); the
# null-radio goldens run 23.04 Msps, which is not an integer divisor of any N310
# MCR. The DU side of the 7.2 split is unaffected (OFH carries frequency-domain
# symbols), so DU configs and KPI gates stay as they are.

log:
  filename: /tmp/proto-ru.log
  level: info

ru_emu:
  timing_cpus: [2]
  cells:
    - network_interface: eth0
      ru_mac_addr: 02:00:00:00:00:20
      du_mac_addr: 02:00:00:00:00:10
      enable_promiscuous: true

      bandwidth: 20
      common_scs: 30
      dl_arfcn: 628032
      band: 78

      dl_port_id: [0, 1]
      ul_port_id: [0, 1]
      prach_port_id: [4, 5]
      prach_format: short

      compr_method_dl: bfp
      compr_bitwidth_dl: 9
      compr_method_ul: bfp
      compr_bitwidth_ul: 9
      compr_method_prach: bfp
      compr_bitwidth_prach: 9
      is_ul_static_compr_hdr: true
      is_dl_static_compr_hdr: true
      iq_scaling: 1.0

      t2a_max_cp_dl: 2435
      t2a_min_cp_dl: 2235
      t2a_max_cp_ul: 2435
      t2a_min_cp_ul: 2235
      t2a_max_up: 2215
      t2a_min_up: 2015
      ta3_max_up: 1200
      ta3_min_up: 800

      ofh_cpus: [3, 4]
      sdr:
        device_driver: "uhd"
        # N310-10 (serial 33A6E56), IQ over SFP1 10 GbE. 122.88 MHz is the
        # N310's lowest supported master clock rate and 30.72 Msps is /4.
        device_args: "type=n3xx,addr=192.168.10.2,mgmt_addr=192.168.10.2,clock_source=internal,time_source=internal,master_clock_rate=122.88e6"
        srate: 30.72
        # Day-1 placeholder gains (N310 range 0-30 dB); lock after the first
        # conducted RF check with the RM520N.
        tx_gain: 10
        rx_gain: 10
        clock_source: internal
        sync_source: internal
        max_proc_delay: 2
        execution_profile: auto
        ru_cpus: [5]
        pinning_policy: mask
