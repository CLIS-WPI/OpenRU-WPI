# DU for the two-host split stack, 2T2R DL / 1 UL port (as bench-20mhz-2t2r, core-host DU pins).
# DU for the bench end-to-end stack: NG/N2 to Open5GS (AMF 10.53.1.2, bind
# 10.53.1.6 on the core bridge) AND Open Fronthaul to ProtO-RU (fh bridge,
# MTU 9000). Core map: DU on the core host, CPUs 6-8 (docker/split-core.env).

cu_cp:
  amf:
    no_core: false
    addrs: 10.53.1.2
    bind_addrs: 10.53.1.6
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_ofh:
  ru_bandwidth_MHz: 20
  t1a_max_cp_dl: 2435
  t1a_min_cp_dl: 2250
  t1a_max_cp_ul: 2435
  t1a_min_cp_ul: 2250
  t1a_max_up: 2215
  t1a_min_up: 2050
  ta4_max: 1480
  ta4_min: 800
  is_prach_cp_enabled: true
  # PRACH receive deadline: wait 20 extra slots (10 ms at 30 kHz) before the
  # fallback pop. Covers the first-light UHD reply delay of 8.8 ms (~18 slots)
  # with ~2 slots margin [UNVERIFIED on UHD; null-radio gate value was 0].
  # Ring limit: 1 + 20 <= 40 - 2 = 38.
  prach_rx_extra_slots: 20
  ignore_ecpri_payload_size: true
  compr_method_ul: bfp
  compr_bitwidth_ul: 9
  compr_method_dl: bfp
  compr_bitwidth_dl: 9
  compr_method_prach: bfp
  compr_bitwidth_prach: 9
  enable_ul_static_compr_hdr: true
  enable_dl_static_compr_hdr: true
  iq_scaling: 16
  cells:
    - network_interface: ofh0
      ru_mac_addr: 02:00:00:00:00:20
      du_mac_addr: 02:00:00:00:00:10
      # Untagged on docker bridge; must match ProtO-RU.
      dl_port_id: [0, 1]
      ul_port_id: [0]
      prach_port_id: [4]

cell_cfg:
  # 2T2R DL + 1 UL port: two DL layers from the UE rank indicator; 2-port CSI-RS (default on, 20 ms).
  pdsch:
    max_rank: 2
  csi:
    csi_rs_enabled: true
    csi_rs_period: 20
  dl_arfcn: 628032
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  nof_antennas_dl: 2
  nof_antennas_ul: 1
  # UE p-Max in SIB (dBm). 10 dBm + ~57 dB path ≈ −47 dBm at N310 RX2,
  # 32 dB below the −15 dBm RX max-input [DATASHEET].
  ul_common:
    p_max: 10
  prach:
    prach_config_index: 159
    prach_root_sequence_index: 1
    zero_correlation_zone: 0
    prach_frequency_start: 0
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5
    nof_dl_slots: 3
    nof_dl_symbols: 10
    nof_ul_slots: 1
    nof_ul_symbols: 2

expert_phy:
  allow_request_on_empty_uplink_slot: true
  max_proc_delay: 10
  pusch_dec_max_iterations: 15

metrics:
  autostart_stdout_metrics: true
  enable_log: true
  enable_verbose: true
  layers:
    enable_ru: true
    enable_sched: true

log:
  filename: /tmp/gnb.log
  all_level: info
  # Per-packet RLC/PDCP/GTP-U/F1-U, per-allocation PHY and OFH packing info lines dominate the DU log (22 GB/hour
  # in Phase D, 2026-11-20). rt_health needs only PHY/RF/OFH warnings; METRICS lines (parse_smoke_fh,
  # measure_slot_delta) stay at info. With ofh at warning, parse_smoke_fh's ul_past_seq_drops (an OFH info line)
  # reads 0 on these profiles. Warnings and errors from these layers still log.
  ofh_level: warning
  phy_level: warning
  rlc_level: warning
  pdcp_level: warning
  gtpu_level: warning
  f1u_level: warning

# Core-host plan (docker/split-core.env): DU_CPUSET=6-8 is isolcpus there, one physical core
# per busy thread (HT siblings 16-18 idle): ru_timing on 6, ru_txrx on 7, main pool on 8. The DU's
# normal threads (main, logger, io_broker) run on CPU 5 (DU_CONTAINER_CPUSET) and
# scripts/split.sh core up checks the map.
expert_execution:
  # Split stack: DU on the core host (docker/split-core.env), one physical core per busy thread.
  affinities:
    main_pool_cpus: 8
    ofh:
      timing_cpu: 6
      txrx_cpus: [7]
