# bench-40mhz ProtO-RU — UHD radio (N310-10), 40 MHz 2x2, stage 2 of the bench
# campaign (docs/BENCH_BUNDLE.md). Four dividers: RF0 TX/RX / RF1 TX/RX /
# RF0 RX2 / RF1 RX2; Out1=modem A, Out2=modem B. First test: modem A,
# modem B AT+CFUN=4. DL 2 layers on TX/RX; UL from RX2.
#
# Sample rate 61.44 Msps = MCR 122.88 MHz / 2 (integer, even decimation), FFT
# 2048 = 61.44e6 / 30 kHz. The null-radio b40 golden runs 46.08 Msps; the DU
# side of the 7.2 split is unaffected by the RU sample rate.

log:
  filename: /tmp/proto-ru.log
  # Keep the normal bench at info. The bounded PRACH-delay measurement mode
  # generates a debug overlay in build/local-profiles/; see
  # `make BENCH=1 PROFILE=bench-40mhz prach-timing`.
  level: info

ru_emu:
  timing_cpus: [2]
  cells:
    - network_interface: ofh0
      ru_mac_addr: 02:00:00:00:00:20
      du_mac_addr: 02:00:00:00:00:10
      enable_promiscuous: true

      bandwidth: 40
      common_scs: 30
      dl_arfcn: 628032
      band: 78

      dl_port_id: [0, 1]
      ul_port_id: [0, 1]
      prach_port_id: [4, 5]
      prach_format: short

      compr_method_dl: bfp
      compr_bitwidth_dl: 9
      compr_method_ul: bfp
      compr_bitwidth_ul: 9
      compr_method_prach: bfp
      compr_bitwidth_prach: 9
      is_ul_static_compr_hdr: true
      is_dl_static_compr_hdr: true
      iq_scaling: 1.0

      t2a_max_cp_dl: 2435
      t2a_min_cp_dl: 2235
      t2a_max_cp_ul: 2435
      t2a_min_cp_ul: 2235
      t2a_max_up: 2215
      t2a_min_up: 2015
      ta3_max_up: 1200
      ta3_min_up: 800

      ofh_cpus: [3, 4]
      sdr:
        device_driver: "uhd"
        # N310-10 (serial 33A6E56), IQ over SFP1 10 GbE. MCR 122.88 MHz / 2 =
        # 61.44 Msps; 122.88 is the N310's lowest supported MCR.
        device_args: "type=n3xx,addr=192.168.10.2,mgmt_addr=192.168.10.2,clock_source=internal,time_source=internal,master_clock_rate=122.88e6"
        srate: 61.44
        # N310 antennas: see radio_uhd_impl.cpp set_tx_antenna ~351 / set_rx_antenna
        # ~414; same-port at ~424 copies TX onto RX (not this cabling).
        # Wrappers: radio_uhd_device.h:199-217.
        tx_antenna: "TX/RX"
        rx_antenna: "RX2"
        transmission_mode: continuous
        # Measured UHD ranges (n310-10 ch0/1, in-container uhd_usrp_probe,
        # 2026-11-19): TX 0.0–65.0 dB, RX 0.0–75.0 dB, step 0.5 dB. UHD gains,
        # not dBm. Start TX at 0, raise 5 dB to RSRP −80…−90 dBm; RX mid-range.
        tx_gain: 0
        rx_gain: 37.5
        clock_source: internal
        sync_source: internal
        max_proc_delay: 2
        execution_profile: auto
        ru_cpus: [5]
        pinning_policy: mask
