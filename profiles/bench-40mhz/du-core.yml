# DU for the bench end-to-end stack: NG/N2 to Open5GS (AMF 10.53.1.2, bind
# 10.53.1.6 on the core bridge) AND Open Fronthaul to ProtO-RU (fh bridge,
# MTU 9000). Bench core map: DU on 8-11 (DU_CPUSET, docker/bench.env).

cu_cp:
  amf:
    no_core: false
    addrs: 10.53.1.2
    bind_addrs: 10.53.1.6
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_ofh:
  ru_bandwidth_MHz: 40
  t1a_max_cp_dl: 2435
  t1a_min_cp_dl: 2250
  t1a_max_cp_ul: 2435
  t1a_min_cp_ul: 2250
  t1a_max_up: 2215
  t1a_min_up: 2050
  ta4_max: 1480
  ta4_min: 800
  is_prach_cp_enabled: true
  # PRACH receive deadline: wait 20 extra slots (10 ms at 30 kHz) before the
  # fallback pop. Covers the first-light UHD reply delay of 8.8 ms (~18 slots)
  # with ~2 slots margin [UNVERIFIED on UHD; null-radio gate value was 0].
  # Ring limit: 1 + 20 <= 40 - 2 = 38.
  prach_rx_extra_slots: 20
  ignore_ecpri_payload_size: true
  compr_method_ul: bfp
  compr_bitwidth_ul: 9
  compr_method_dl: bfp
  compr_bitwidth_dl: 9
  compr_method_prach: bfp
  compr_bitwidth_prach: 9
  enable_ul_static_compr_hdr: true
  enable_dl_static_compr_hdr: true
  iq_scaling: 16
  cells:
    - network_interface: ofh0
      ru_mac_addr: 02:00:00:00:00:20
      du_mac_addr: 02:00:00:00:00:10
      # Untagged on docker bridge; must match ProtO-RU.
      dl_port_id: [0, 1]
      ul_port_id: [0, 1]
      prach_port_id: [4, 5]

cell_cfg:
  dl_arfcn: 628032
  band: 78
  channel_bandwidth_MHz: 40
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  nof_antennas_dl: 2
  nof_antennas_ul: 2
  # UE p-Max in SIB (dBm). 10 dBm + ~57 dB path ≈ −47 dBm at N310 RX2,
  # 32 dB below the −15 dBm RX max-input [DATASHEET].
  ul_common:
    p_max: 10
  prach:
    prach_config_index: 159
    prach_root_sequence_index: 1
    zero_correlation_zone: 0
    prach_frequency_start: 0
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5
    nof_dl_slots: 3
    nof_dl_symbols: 10
    nof_ul_slots: 1
    nof_ul_symbols: 2

expert_phy:
  allow_request_on_empty_uplink_slot: true
  max_proc_delay: 10
  pusch_dec_max_iterations: 15

metrics:
  autostart_stdout_metrics: true
  enable_log: true
  enable_verbose: true
  layers:
    enable_ru: true
    enable_sched: true

log:
  filename: /tmp/gnb.log
  all_level: info
  # The Phase D DU log (22 GB/hour, 2026-11-20) was RLC 44%, PDCP 21%, GTP-U 17%, PHY 8% info lines; OFH was ~0%.
  # Those four (and F1-U) go to warning; no analyser reads their info lines (rt_health counts PHY/RF/OFH warnings).
  # OFH and METRICS stay at info (all_level): parse_smoke_fh reads ul_past_seq_drops from an OFH info line and the
  # METRICS lines feed parse_smoke_fh and measure_slot_delta. (The 29 GB/hour figure elsewhere is the RU's
  # proto-ru.log under the prach-timing debug overlay, not this file.)
  phy_level: warning
  rlc_level: warning
  pdcp_level: warning
  gtpu_level: warning
  f1u_level: warning

# Cores plan (docker/bench.env, accepted 2026-11-20): DU_CPUSET=8-11 is isolcpus, so
# every busy thread needs its own CPU. ru_timing alone on 9 (its HT sibling 8 stays idle),
# ru_txrx on 10, main pool on 11. The DU's normal threads (main, logger, io_broker) start on
# the container's E-core 13 (DU_CONTAINER_CPUSET) and scripts/up.sh checks the map.
# [UNVERIFIED] Pins measured on hardware only with bench-20mhz/du-core.yml (1T1R);
# not yet tested with this file.
expert_execution:
  affinities:
    main_pool_cpus: 11
    ofh:
      timing_cpu: 9
      txrx_cpus: [10]
